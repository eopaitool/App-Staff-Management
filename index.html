<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Class Registration | Apr - Dec 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fef9f3;
    --ink: #1a1a2e;
    --ink-soft: #4a4a5e;
    --ink-mute: #8a8a9e;
    --line: #ececf0;
    --card: #ffffff;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.04);
    --shadow-md: 0 8px 28px rgba(0,0,0,.08);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: 'Prompt', sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body {
    background-image:
      radial-gradient(circle at 8% 12%, #ffd6e0 0%, transparent 22%),
      radial-gradient(circle at 92% 18%, #ffe8b8 0%, transparent 22%),
      radial-gradient(circle at 5% 88%, #d4f4e8 0%, transparent 22%),
      radial-gradient(circle at 95% 92%, #e0d4ff 0%, transparent 22%);
    min-height: 100vh;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; }

  header.banner {
    background: linear-gradient(135deg, #ff7eb9 0%, #ff5e8a 100%);
    border-radius: 28px; padding: 36px 40px;
    box-shadow: var(--shadow-md); margin-bottom: 12px;
    position: relative; overflow: hidden;
  }
  header.banner::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 80% -20%, rgba(255,255,255,.25), transparent 50%);
    pointer-events: none;
  }
  header h1 {
    font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800;
    font-size: clamp(28px, 4vw, 42px); color: #fff; letter-spacing: -.5px;
    display: flex; align-items: center; gap: 16px;
  }
  header p.sub { color: rgba(255,255,255,.92); font-size: 15px; margin-top: 8px; font-style: italic; font-weight: 400; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin: 28px 0 24px; align-items: center; justify-content: space-between;
  }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 16px; border-radius: 100px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink-soft); font-family: inherit;
    font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s;
  }
  .chip:hover { border-color: var(--ink); }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-mute); }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; }

  .card {
    background: var(--card); border-radius: 22px; padding: 0;
    border: 2px solid var(--accent);
    box-shadow: var(--shadow-sm);
    transition: transform .25s ease, box-shadow .25s ease;
    overflow: hidden; display: flex; flex-direction: column; position: relative;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .card-head { padding: 18px 20px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .badge {
    background: var(--accent); color: #fff;
    padding: 4px 12px; border-radius: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .icon { font-size: 28px; line-height: 1; }
  .card-body { padding: 12px 20px 18px; flex: 1; }
  .card h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--ink); }
  .card .desc { font-size: 13.5px; color: var(--ink-soft); font-style: italic; line-height: 1.45; min-height: 38px; }
  .card .date { margin-top: 14px; font-size: 14px; font-weight: 500; color: var(--accent); display: flex; align-items: center; gap: 8px; }

  .card-stats {
    padding: 12px 20px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.015));
    display: flex; gap: 14px; font-size: 12.5px; border-top: 1px dashed var(--line);
  }
  .stat { flex: 1; }
  .stat-label { color: var(--ink-mute); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .stat-val { font-weight: 700; color: var(--ink); font-size: 15px; margin-top: 2px; }
  .stat-val .max { color: var(--ink-mute); font-weight: 400; font-size: 13px; }
  .progress { height: 6px; background: rgba(0,0,0,.05); border-radius: 100px; overflow: hidden; margin: 0 20px 14px; }
  .progress-bar { height: 100%; background: var(--accent); border-radius: 100px; transition: width .4s ease; }

  .card-actions { padding: 0 16px 16px; display: flex; gap: 8px; }
  .btn {
    border: none; cursor: pointer; font-family: inherit; font-weight: 600;
    border-radius: 12px; padding: 10px 16px; font-size: 14px;
    transition: all .15s; flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(.92); transform: translateY(-1px); }
  .btn-ghost { background: rgba(0,0,0,.04); color: var(--ink); }
  .btn-ghost:hover { background: rgba(0,0,0,.08); }
  .btn-full { background: var(--ink); color: #fff; padding: 12px 20px; }
  .btn-full:hover { background: #000; }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

  .overlay {
    position: fixed; inset: 0; background: rgba(20,20,30,.55);
    backdrop-filter: blur(6px); z-index: 100;
    display: none; align-items: center; justify-content: center;
    padding: 20px; animation: fade .2s ease;
  }
  .overlay.show { display: flex; }
  @keyframes fade { from {opacity:0} to {opacity:1} }
  .modal {
    background: #fff; border-radius: 24px; max-width: 720px; width: 100%;
    max-height: 90vh; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg); animation: pop .25s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from {transform: scale(.92); opacity:0} to {transform: scale(1); opacity:1} }
  .modal-head { padding: 28px 32px 20px; border-bottom: 1px solid var(--line); color: #fff; position: relative; }
  .modal-head h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 800; line-height: 1.2; }
  .modal-head .modal-meta { margin-top: 8px; font-size: 14px; opacity: .92; font-style: italic; }
  .modal-head .close {
    position: absolute; top: 20px; right: 20px;
    background: rgba(255,255,255,.2); border: none; color: #fff;
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center; transition: background .15s;
  }
  .modal-head .close:hover { background: rgba(255,255,255,.35); }

  .modal-body { padding: 28px 32px; overflow-y: auto; flex: 1; }
  .modal-section { margin-bottom: 28px; }
  .modal-section:last-child { margin-bottom: 0; }
  .section-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px; font-weight: 700; color: var(--ink-mute);
    letter-spacing: 1.2px; text-transform: uppercase;
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .section-title .count {
    background: var(--accent); color: #fff;
    padding: 2px 10px; border-radius: 100px; font-size: 11px;
  }

  .person-list { display: flex; flex-direction: column; gap: 8px; }
  .person {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: rgba(0,0,0,.025);
    border-radius: 12px;
  }
  .person.waitlist { background: rgba(255,184,77,.12); }
  .person .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .person .info { flex: 1; min-width: 0; }
  .person .name { font-weight: 600; font-size: 14.5px; color: var(--ink); }
  .person .meta { font-size: 12px; color: var(--ink-mute); margin-top: 1px; }
  .person .rank {
    font-size: 11px; color: var(--ink-mute); font-weight: 600;
    background: rgba(0,0,0,.04); padding: 3px 8px; border-radius: 6px;
  }
  .person button.unreg {
    border: none; background: transparent; color: var(--ink-mute);
    cursor: pointer; padding: 4px 8px; border-radius: 6px; font-size: 12px;
    font-family: inherit;
  }
  .person button.unreg:hover { background: rgba(255,0,0,.08); color: #d44; }

  .empty-state {
    text-align: center; padding: 24px; color: var(--ink-mute);
    font-size: 13.5px; background: rgba(0,0,0,.02);
    border-radius: 12px; border: 1.5px dashed var(--line);
  }

  form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  form .full { grid-column: 1 / -1; }
  .field label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--ink-soft); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .field input, .field select {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--line);
    border-radius: 10px; font-size: 14px; font-family: inherit;
    background: #fff; transition: border-color .15s;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field .hint { font-size: 11.5px; color: var(--ink-mute); margin-top: 4px; }

  .alert {
    padding: 12px 14px; border-radius: 10px; font-size: 13.5px;
    margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start;
  }
  .alert-warn { background: #fff4e0; color: #8a5a00; border-left: 3px solid #ffb84d; }
  .alert-info { background: #e8f4ff; color: #0a4a82; border-left: 3px solid #4a90e2; }
  .alert-err  { background: #ffe8ec; color: #8a0a20; border-left: 3px solid #ff5e8a; }

  .loader { text-align: center; padding: 40px; color: var(--ink-mute); }
  .spinner {
    display: inline-block; width: 24px; height: 24px;
    border: 3px solid var(--line); border-top-color: var(--ink);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff;
    padding: 12px 20px; border-radius: 100px; font-size: 14px;
    box-shadow: var(--shadow-lg); z-index: 200;
    opacity: 0; pointer-events: none;
    transition: all .25s; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .toast.error { background: #c8203b; }

  @media (max-width: 600px) {
    .wrap { padding: 16px 14px 40px; }
    header.banner { padding: 24px 22px; }
    form { grid-template-columns: 1fr; }
    .modal-head, .modal-body { padding: 22px 22px; }
    .toolbar { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="banner">
    <h1><span>🎓</span> Training Class · Onsite Workshop</h1>
    <p class="sub">Apr – Dec 2026  |  9.00 – 16.30 น.  |  Onsite @ Panjathani</p>
  </header>

  <div class="toolbar">
    <div class="filters">
      <button class="chip active" data-filter="all">ทั้งหมด</button>
      <button class="chip" data-filter="confirmed">Confirmed</button>
      <button class="chip" data-filter="request">Request by BU</button>
    </div>
    <div class="legend">
      <span><span class="legend-dot" style="background:#52c878"></span>มีที่ว่าง</span>
      <span><span class="legend-dot" style="background:#ffb84d"></span>ใกล้เต็ม</span>
      <span><span class="legend-dot" style="background:#ff5e8a"></span>เต็ม / Backfill</span>
    </div>
  </div>

  <div id="grid" class="grid">
    <div class="loader" style="grid-column:1/-1">
      <div class="spinner"></div>
      <div style="margin-top:12px">กำลังโหลดข้อมูลจาก Google Sheet...</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head" id="modalHead">
      <button class="close" onclick="closeModal()">×</button>
      <h2 id="modalTitle"></h2>
      <div class="modal-meta" id="modalMeta"></div>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let STATE = { courses: [], spareTeam: [], registrations: [] };
let currentFilter = 'all';
let activeCourseId = null;

// ---------- Boot ----------
function boot() {
  google.script.run
    .withSuccessHandler(data => { STATE = data; renderGrid(); })
    .withFailureHandler(err => { showToast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, true); })
    .getInitialData();
}

function refresh(silent) {
  google.script.run
    .withSuccessHandler(list => {
      STATE.registrations = list || [];
      renderGrid();
      if (activeCourseId) renderModalBody();
    })
    .withFailureHandler(err => { if (!silent) showToast('Refresh ผิดพลาด', true); })
    .getRegistrations();
}

// ---------- Grid render ----------
function renderGrid() {
  const grid = document.getElementById('grid');
  const courses = STATE.courses.filter(c => {
    if (currentFilter === 'all') return true;
    return (c.status || '').toLowerCase() === currentFilter;
  });

  if (courses.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1; padding:40px">
        ยังไม่มีข้อมูลคอร์สในแท็บ "Course"<br>
        <small>โปรดเปิด Apps Script และรันฟังก์ชัน <code>setupSheets()</code> เพื่อสร้างข้อมูลตัวอย่าง</small>
      </div>`;
    return;
  }

  grid.innerHTML = courses.map(c => {
    const reg = STATE.registrations.filter(r => r.course === c.name && r.date === c.date);
    const registered = reg.slice(0, c.capacity).length;
    const waitlist   = Math.max(0, reg.length - c.capacity);
    const ratio = Math.min(registered / c.capacity, 1);
    const dotColor = ratio >= 1 ? '#ff5e8a' : (ratio >= 0.8 ? '#ffb84d' : '#52c878');

    return `
      <div class="card" style="--accent:${c.color}">
        <div class="card-head">
          <span class="badge">${escapeHtml(c.status)}</span>
          <span class="icon">${c.icon}</span>
        </div>
        <div class="card-body">
          <h3>${escapeHtml(c.name)}</h3>
          <p class="desc">${escapeHtml(c.desc || '')}</p>
          <div class="date">📅 ${escapeHtml(c.date || 'TBD')}</div>
        </div>
        <div class="progress"><div class="progress-bar" style="width:${ratio*100}%"></div></div>
        <div class="card-stats">
          <div class="stat">
            <div class="stat-label">
              <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${dotColor};margin-right:4px;vertical-align:middle"></span>
              Registered
            </div>
            <div class="stat-val">${registered}<span class="max">/${c.capacity}</span></div>
          </div>
          <div class="stat">
            <div class="stat-label">Backfill</div>
            <div class="stat-val">${waitlist}<span class="max"> คน</span></div>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn btn-ghost" onclick="openModal('${c.id}','view')">👥 ดูรายชื่อ</button>
          <button class="btn btn-primary" onclick="openModal('${c.id}','register')">+ ลงทะเบียน</button>
        </div>
      </div>`;
  }).join('');
}

// ---------- Modal ----------
function openModal(courseId) {
  activeCourseId = courseId;
  const c = STATE.courses.find(x => x.id === courseId);
  if (!c) return;
  const head = document.getElementById('modalHead');
  head.style.background = `linear-gradient(135deg, ${c.color} 0%, ${c.color}dd 100%)`;
  document.getElementById('modalTitle').textContent = `${c.icon}  ${c.name}`;
  document.getElementById('modalMeta').textContent  = `📅 ${c.date}   ·   ${c.desc || ''}`;
  document.getElementById('overlay').classList.add('show');
  renderModalBody();
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
  activeCourseId = null;
}

function renderModalBody() {
  const c = STATE.courses.find(x => x.id === activeCourseId);
  if (!c) return;

  const reg = STATE.registrations.filter(r => r.course === c.name && r.date === c.date);
  const registered = reg.slice(0, c.capacity);
  const waitlist   = reg.slice(c.capacity);
  const isFull = registered.length >= c.capacity;

  // Spare names already used on this date (anywhere)
  const usedSpares = new Set(
    STATE.registrations
      .filter(r => r.date === c.date && r.spare)
      .map(r => r.spare.toLowerCase())
  );
  const availableSpares = STATE.spareTeam.filter(s => !usedSpares.has(s.name.toLowerCase()));

  // Unique sites for site dropdown helper
  const sites = Array.from(new Set([
    ...STATE.spareTeam.map(s => s.site).filter(Boolean),
    ...STATE.registrations.map(r => r.site).filter(Boolean).map(s => s.replace(/\s*\[BACKFILL\]\s*/i,'')),
  ])).sort();

  const formHtml = `
    <div class="modal-section">
      <div class="section-title">📝 ${isFull ? 'ลงทะเบียน Backfill (รอที่ว่าง)' : 'ลงทะเบียนเข้าร่วม'}</div>
      ${isFull
        ? `<div class="alert alert-warn">⚠️ คลาสนี้เต็มแล้ว (${registered.length}/${c.capacity}) — การลงทะเบียนจะถูกเพิ่มในรายการ Backfill ลำดับที่ ${waitlist.length+1}</div>`
        : `<div class="alert alert-info">💡 เหลือที่ว่าง ${c.capacity - registered.length} ที่นั่ง</div>`}

      <div class="alert alert-warn" style="font-size:12.5px">
        🔒 <strong>เงื่อนไข Spare Team:</strong> Spare แต่ละคนเลือกได้เพียง 1 คอร์สต่อวันเท่านั้น —
        ${availableSpares.length === STATE.spareTeam.length
          ? `ทุกคน (${availableSpares.length} คน) ยังว่างสำหรับวันที่นี้`
          : `เหลือ Spare ที่ว่างสำหรับ ${escapeHtml(c.date)} อีก <strong>${availableSpares.length}/${STATE.spareTeam.length}</strong> คน`}
      </div>

      <div id="formError"></div>

      <form onsubmit="submit(event)">
        <div class="field full">
          <label>ชื่อ-นามสกุล *</label>
          <input type="text" name="name" required placeholder="เช่น สมชาย ใจดี">
        </div>
        <div class="field">
          <label>Site *</label>
          <input list="sitesList" name="site" required placeholder="พิมพ์หรือเลือก">
          <datalist id="sitesList">
            ${sites.map(s => `<option value="${escapeAttr(s)}">`).join('')}
          </datalist>
        </div>
        <div class="field">
          <label>Spare Name${availableSpares.length === 0 ? '' : ' *'}</label>
          <select name="spare" ${availableSpares.length === 0 ? '' : 'required'}>
            <option value="">— เลือก Spare —</option>
            ${availableSpares.map(s => `<option value="${escapeAttr(s.name)}">${escapeHtml(s.name)}${s.site ? ' · '+escapeHtml(s.site) : ''}</option>`).join('')}
          </select>
          <div class="hint">${availableSpares.length === 0 ? 'ไม่มี Spare ว่างสำหรับวันนี้' : 'แสดงเฉพาะคนที่ยังไม่ถูกเลือกในวันที่ ' + escapeHtml(c.date)}</div>
        </div>
        <div class="field full">
          <button type="submit" class="btn btn-full" id="submitBtn">
            ${isFull ? '➕ เพิ่มชื่อใน Backfill' : '✓ ยืนยันการลงทะเบียน'}
          </button>
        </div>
      </form>
    </div>

    <div class="modal-section">
      <div class="section-title">✅ ผู้ลงทะเบียน <span class="count">${registered.length}/${c.capacity}</span></div>
      ${registered.length === 0
        ? `<div class="empty-state">ยังไม่มีผู้ลงทะเบียน — เป็นคนแรกได้เลย!</div>`
        : `<div class="person-list">${registered.map((p,i) => personHtml(p,i+1,c.color,false)).join('')}</div>`}
    </div>

    <div class="modal-section">
      <div class="section-title">⏳ Backfill (รายการสำรอง) <span class="count">${waitlist.length}</span></div>
      ${waitlist.length === 0
        ? `<div class="empty-state">ยังไม่มี Backfill ในขณะนี้</div>`
        : `<div class="person-list">${waitlist.map((p,i) => personHtml(p,i+1,c.color,true)).join('')}</div>`}
    </div>
  `;

  document.getElementById('modalBody').innerHTML = formHtml;
}

function personHtml(p, rank, accent, isWait) {
  const initials = p.name.trim().split(/\s+/).map(x => x[0]).slice(0,2).join('').toUpperCase();
  return `
    <div class="person ${isWait ? 'waitlist' : ''}">
      <div class="avatar" style="background:${accent}">${escapeHtml(initials)}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="meta">${escapeHtml(p.site || '-')}${p.spare ? ' · Spare: '+escapeHtml(p.spare) : ''}</div>
      </div>
      <span class="rank">#${rank}</span>
      <button class="unreg" title="ยกเลิก" onclick="cancelReg(${p.rowIndex})">✕</button>
    </div>`;
}

// ---------- Submit ----------
function submit(e) {
  e.preventDefault();
  const c = STATE.courses.find(x => x.id === activeCourseId);
  const form = e.target;
  const btn = document.getElementById('submitBtn');
  const errBox = document.getElementById('formError');
  errBox.innerHTML = '';

  const payload = {
    name:   form.name.value.trim(),
    site:   form.site.value.trim(),
    course: c.name,
    date:   c.date,
    spare:  form.spare.value.trim(),
  };

  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';

  google.script.run
    .withSuccessHandler(res => {
      btn.disabled = false;
      btn.textContent = '✓ ยืนยันการลงทะเบียน';
      if (!res.ok) {
        errBox.innerHTML = `<div class="alert alert-err">❌ ${escapeHtml(res.error)}</div>`;
        return;
      }
      showToast(res.message);
      STATE.registrations = res.registrations || [];
      form.reset();
      renderGrid();
      renderModalBody();
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = '✓ ยืนยันการลงทะเบียน';
      errBox.innerHTML = `<div class="alert alert-err">❌ ${escapeHtml(err.message)}</div>`;
    })
    .submitRegistration(payload);
}

function cancelReg(rowIndex) {
  if (!confirm('ยืนยันการยกเลิกการลงทะเบียน?')) return;
  google.script.run
    .withSuccessHandler(res => {
      if (!res.ok) { showToast(res.error, true); return; }
      STATE.registrations = res.registrations || [];
      showToast('✓ ยกเลิกการลงทะเบียนแล้ว');
      renderGrid();
      renderModalBody();
    })
    .withFailureHandler(err => showToast(err.message, true))
    .unregister(rowIndex);
}

// ---------- Utils ----------
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s) { return escapeHtml(s); }

document.querySelectorAll('.chip').forEach(chip => {
  chip.onclick = () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    renderGrid();
  };
});
document.getElementById('overlay').onclick = (e) => { if (e.target.id === 'overlay') closeModal(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// Auto-refresh every 20s to pick up other people's submissions
setInterval(() => refresh(true), 20000);

boot();
</script>
</body>
</html>
